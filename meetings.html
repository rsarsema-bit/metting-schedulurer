```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProMeet | Meetings</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Mobile Hamburger -->
    <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="hamburger">
        ☰
    </label>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <h2>🚀 ProMeet</h2>
                <p>Professional Meeting Scheduler</p>
            </div>

            <ul>

                <li>
                    <a href="index.html">
                        🏠 Home
                    </a>
                </li>

                <li class="active">
                    <a href="meeting.html">
                        📅 Meetings
                    </a>
                </li>

                <li>
                    <a href="calandar.html">
                        🗓 Calendar
                    </a>
                </li>

                <li>
                    <a href="settings.html">
                        ⚙ Settings
                    </a>
                </li>

            </ul>

            <div class="sidebar-footer">
                <small>© 2026 ProMeet</small>
            </div>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <header>
                <h1>📅 Meetings</h1>
                <p>
                    Schedule, organize, and manage your professional meetings.
                </p>
            </header>

            <section class="meeting-form">

                <h2>Schedule Meeting</h2>

                <input
                    type="text"
                    id="title"
                    placeholder="Meeting Title">

                <textarea
                    id="description"
                    placeholder="Meeting Description"></textarea>

                <div class="row">

                    <input
                        type="date"
                        id="date">

                    <input
                        type="time"
                        id="time">

                </div>

                <input
                    type="text"
                    id="participants"
                    placeholder="Participants Emails">

                <button onclick="addMeeting()">
                    Schedule Meeting
                </button>

            </section>

            <section class="meeting-list">

                <h2>Upcoming Meetings</h2>

                <div id="meetingsContainer"></div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
