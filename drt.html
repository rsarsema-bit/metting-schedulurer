<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Declaration</title>
</head>
<body>
    <p>Function Declaration</p>
    <p>Write a function called greet that takes a name as an input and returns a greeting message.</p>  
    <p>Example: greet("Alice") should return "Hello, Alice!"</p>
    <script>
        function greet(name) {
            return "Hello," +name+ "!";
        }

        console.log(greet("Alice")); // Hello, Alice!
        console.log(greet("Bob"));   // Hello, Bob!
    </script>
</body>
</html>
