<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>call the function before it’s defined in the code.</title>
</head>
<body>
    <p>call the function before it’s defined in the code.</p>
    <script>
        console.log(greet("Alice")); // Hello, Alice!

        function greet(name) {
            return "Hello," +name+ "!";
        }   
    </script>
</body>
</html>
