<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops ( while, do…while)</title>
</head>
<body>
    <p>Loops ( while, do…while)</p>
    <p>1. What is the output of the following code?</p>
    <script>
        let i = 0;
        while (i < 10) {
            console.log(i);
            i++;
        }
    </script>
    <p>2. What is the output of the following code?</p>
    <script>
        let j = 88;
        do {
            console.log(j);
            j++;
        } while (j < 100);
    </script>
</body>
</html>
