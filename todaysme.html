
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProMeet | Today's Meetings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Mobile Hamburger -->
    <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="hamburger">
        ☰
    </label>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <h2>🚀 ProMeet</h2>
                <p>Professional Meeting Scheduler</p>
            </div>

            <ul>

                <li>
                    <a href="index.html">🏠 Home</a>
                </li>

                <li>
                    <a href="schedulemeeting.html">📅 Schedule Meeting</a>
                </li>

                <li class="active">
                    <a href="todaysme.html">🕒 Today's Meetings</a>
                </li>

                <li>
                    <a href="members.html">👥 Team Members</a>
                </li>

                <li>
                    <a href="ccc.html">🗓 Calendar</a>
                </li>

                <li>
                    <a href="settings.html">⚙ Settings</a>
                </li>

                <li>
                    <a href="about.html">ℹ About</a>
                </li>

            </ul>

            <div class="sidebar-footer">
                <small>© 2026 ProMeet</small>
            </div>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <header>
                <h1>🕒 Today's Meetings</h1>
                <p>
                    Stay organized and manage all your meetings scheduled for today.
                </p>
            </header>

            <div class="meeting-list">

                <h2 id="todayDate"></h2>

                <div id="meetingContainer"></div>

            </div>

        </main>

    </div>

    <script>

        const today =
            new Date().toISOString().split("T")[0];

        document.getElementById("todayDate")
            .innerHTML = "📅 Today: " + today;

        let meetings =
            JSON.parse(localStorage.getItem("meetings")) || [];

        function renderTodayMeetings() {

            const container =
                document.getElementById("meetingContainer");

            container.innerHTML = "";

            const todaysMeetings =
                meetings.filter(
                    meeting => meeting.date === today
                );

            if (todaysMeetings.length === 0) {

                container.innerHTML = `
                    <div class="meeting-card">
                        <h3>🎉 No Meetings Today</h3>
                        <p>Enjoy your free time and stay productive!</p>
                    </div>
                `;

                return;
            }

            todaysMeetings.forEach(meeting => {

                const originalIndex =
                    meetings.findIndex(m =>
                        m.title === meeting.title &&
                        m.date === meeting.date &&
                        m.time === meeting.time
                    );

                container.innerHTML += `

                <div class="meeting-card"
                style="animation:fadeIn .5s ease;">

                    <h3>📌 ${meeting.title}</h3>

                    <p>
                        <strong>📅 Date:</strong>
                        ${meeting.date}
                    </p>

                    <p>
                        <strong>🕒 Time:</strong>
                        ${meeting.time}
                    </p>

                    <p>
                        <strong>👥 Participants:</strong>
                        ${meeting.participants || "Not specified"}
                    </p>

                    <span class="tag"
                    style="
                    background:${meeting.status === 'Completed'
                        ? '#10b981'
                        : '#2563eb'};
                    color:white;
                    ">
                        ${meeting.status || "Scheduled"}
                    </span>

                    <div class="row">

                        <button
                        onclick="completeMeeting(${originalIndex})"
                        ${meeting.status === "Completed" ? "disabled" : ""}>
                        ${meeting.status === "Completed"
                            ? "✔ Completed"
                            : "✔ Complete"}
                        </button>

                        <button
                        style="background:#ef4444;"
                        onclick="deleteMeeting(${originalIndex})">
                        🗑 Delete
                        </button>

                    </div>

                </div>

                `;

            });

        }

        function completeMeeting(index) {

            meetings[index].status = "Completed";

            localStorage.setItem(
                "meetings",
                JSON.stringify(meetings)
            );

            renderTodayMeetings();

        }

        function deleteMeeting(index) {

            if (confirm("Delete this meeting?")) {

                meetings.splice(index, 1);

                localStorage.setItem(
                    "meetings",
                    JSON.stringify(meetings)
                );

                renderTodayMeetings();

            }

        }

        renderTodayMeetings();

    </script>

</body>

</html>
