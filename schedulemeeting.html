<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Meeting</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#0f172a;
}

.container{
    width:100%;
    max-width:550px;
}

.form-box{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:white;
}

input, select{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#4338ca;
    transform:scale(1.02);
}
</style>
</head>

<body>

<div class="container">
<div class="form-box">

<h1>📅 Schedule Meeting</h1>

<input type="text" id="title" placeholder="Meeting Title">
<input type="date" id="date">
<input type="time" id="time">
<input type="text" id="participants" placeholder="Participants (optional)">

<select id="status">
    <option value="Scheduled">Scheduled</option>
    <option value="Completed">Completed</option>
</select>

<button onclick="addMeeting()">Schedule Meeting</button>

</div>
</div>

<script>
let meetings = JSON.parse(localStorage.getItem("meetings")) || [];

function saveMeetings(){
    localStorage.setItem("meetings", JSON.stringify(meetings));
}

function addMeeting(){

    const title = document.getElementById("title").value.trim();
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const participants = document.getElementById("participants").value.trim();
    const status = document.getElementById("status").value;

    // ✅ FIXED validation
    if(title === "" || date === "" || time === ""){
        alert("Please fill Title, Date and Time!");
        return;
    }

    const meeting = {
        id: Date.now(),
        title,
        date,
        time,
        participants,
        status
    };

    meetings.push(meeting);
    saveMeetings();

    // clear form
    document.getElementById("title").value = "";
    document.getElementById("date").value = "";
    document.getElementById("time").value = "";
    document.getElementById("participants").value = "";
    document.getElementById("status").value = "Scheduled";

    alert("✅ Meeting saved successfully!");
}
</script>

</body>
</html>
