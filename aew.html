<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>
<body>
    <h1>Arrow Function</h1>
    <p>An arrow function is a shorter syntax for writing function expressions. It uses the => operator and does not have its own this, arguments, super, or new.target.</p>
    <p>Example of an arrow function:</p>
    <p>add two numbers:</p>
    <script>
        var add = (a, b) => a + b;
        console.log(add(2, 3)); // 5
    </script>
</body>
</html>
