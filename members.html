<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProMeet | Team Members</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .controls{
            display:flex;
            gap:15px;
            margin-bottom:25px;
            flex-wrap:wrap;
        }

        .controls input{
            flex:1;
        }

        .member-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
            gap:20px;
        }

        .member-card{
            background:rgba(255,255,255,.12);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:18px;
            padding:25px;
            text-align:center;
            transition:.3s;
            color:white;
        }

        .member-card:hover{
            transform:translateY(-8px);
            box-shadow:0 0 25px rgba(96,165,250,.5);
        }

        .avatar{
            width:85px;
            height:85px;
            margin:auto;
            border-radius:50%;
            background:#2563eb;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:32px;
            font-weight:bold;
            margin-bottom:15px;
            box-shadow:0 0 20px rgba(59,130,246,.6);
        }

        .member-card h3{
            margin-bottom:8px;
        }

        .member-card p{
            color:#dbeafe;
            margin-bottom:20px;
        }

        .actions{
            display:flex;
            gap:10px;
        }

        .edit-btn{
            background:#f59e0b;
        }

        .delete-btn{
            background:#ef4444;
        }

        @media(max-width:900px){

            .controls{
                flex-direction:column;
            }

            .actions{
                flex-direction:column;
            }

        }

    </style>

</head>

<body>

    <!-- Mobile Hamburger -->

    <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="hamburger">
        ☰
    </label>

    <div class="container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">
                <h2>🚀 ProMeet</h2>
                <p>Professional Meeting Scheduler</p>
            </div>

            <ul>

                <li>
                    <a href="index.html">
                        🏠 Home
                    </a>
                </li>

                <li>
                    <a href="schedulemeeting.html">
                        📅 Schedule Meeting
                    </a>
                </li>

                <li>
                    <a href="todaysme.html">
                        🕒 Today's Meetings
                    </a>
                </li>

                <li class="active">
                    <a href="members.html">
                        👥 Team Members
                    </a>
                </li>

                <li>
                    <a href="ccc.html">
                        🗓 Calendar
                    </a>
                </li>

                <li>
                    <a href="settings.html">
                        ⚙ Settings
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        ℹ About
                    </a>
                </li>

            </ul>

            <div class="sidebar-footer">
                <small>© 2026 ProMeet</small>
            </div>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <header>
                <h1>👥 Team Members</h1>
                <p>
                    Manage your team and collaborate effectively.
                </p>
            </header>

            <div class="meeting-list">

                <div class="controls">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search member...">

                    <button onclick="addMember()">
                        ➕ Add Member
                    </button>

                </div>

                <h3 style="margin-bottom:20px;">
                    Total Members:
                    <span id="memberCount">0</span>
                </h3>

                <div
                    class="member-grid"
                    id="memberGrid">
                </div>

            </div>

        </main>

    </div>

    <script>

        if (!localStorage.getItem("members")) {

            localStorage.setItem(
                "members",
                JSON.stringify([
                    {
                        name: "Arsema",
                        role: "Project Manager"
                    },
                    {
                        name: "Alemtsahay",
                        role: "Frontend Developer"
                    },
                    {
                        name: "Aster",
                        role: "UI/UX Designer"
                    },
                    {
                        name: "Biftu",
                        role: "Backend Developer"
                    }
                ])
            );

        }

        let members =
            JSON.parse(
                localStorage.getItem("members")
            );

        function saveMembers() {

            localStorage.setItem(
                "members",
                JSON.stringify(members)
            );

        }

        function renderMembers() {

            const grid =
                document.getElementById("memberGrid");

            grid.innerHTML = "";

            document.getElementById(
                "memberCount"
            ).textContent = members.length;

            members.forEach((member, index) => {

                grid.innerHTML += `

                <div class="member-card">

                    <div class="avatar">
                        ${member.name.charAt(0).toUpperCase()}
                    </div>

                    <h3>${member.name}</h3>

                    <p>${member.role}</p>

                    <div class="actions">

                        <button
                        class="edit-btn"
                        onclick="editMember(${index})">
                        Edit
                        </button>

                        <button
                        class="delete-btn"
                        onclick="deleteMember(${index})">
                        Delete
                        </button>

                    </div>

                </div>

                `;

            });

        }

        function addMember() {

            const name =
                prompt("Enter member name:");

            if (!name) return;

            const role =
                prompt("Enter member role:");

            members.push({
                name: name,
                role: role || "Team Member"
            });

            saveMembers();
            renderMembers();

        }

        function editMember(index) {

            const newName =
                prompt(
                    "Edit Name:",
                    members[index].name
                );

            if (newName === null) return;

            const newRole =
                prompt(
                    "Edit Role:",
                    members[index].role
                );

            if (newRole === null) return;

            members[index].name = newName;
            members[index].role = newRole;

            saveMembers();
            renderMembers();

        }

        function deleteMember(index) {

            if (confirm("Delete member?")) {

                members.splice(index, 1);

                saveMembers();
                renderMembers();

            }

        }

        document
            .getElementById("searchInput")
            .addEventListener(
                "keyup",
                function () {

                    const value =
                        this.value.toLowerCase();

                    document
                        .querySelectorAll(".member-card")
                        .forEach(card => {

                            card.style.display =
                                card.textContent
                                .toLowerCase()
                                .includes(value)
                                ? "block"
                                : "none";

                        });

                }
            );

        renderMembers();

    </script>

</body>

</html>
